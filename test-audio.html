<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-notifications — sound test (dev only)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f6f7; color: #1c1e21; margin: 0; padding: 32px; }
  h1 { font-size: 18px; }
  p.hint { color: #6b7280; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 900px; }
  button { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  button:hover { background: #eef2ff; border-color: #6366f1; }
</style>
</head>
<body>
<h1>dsh-notifications — sound test</h1>
<p class="hint">Click any card to preview that sound. Engine code mirrors src/client/audio.ts (canonical spec: mockup/index.html).</p>
<div class="grid" id="grid"></div>
<script>
/* Web Audio engine — plain-JS mirror of src/client/audio.ts */
var audioCtx = null;
var masterGain = null;
var currentVolume = 80;

function volumeToGain(v) { return Math.pow(v / 100, 1.5) * 0.9; }

function ensureAudio() {
  if (!audioCtx) {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctor();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = volumeToGain(currentVolume);
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function setVolume(v) {
  currentVolume = v;
  if (masterGain) masterGain.gain.value = volumeToGain(v);
}

/* One oscillator note: exponential decay envelope, optional pitch glide and vibrato. */
function note(opts) {
  var ctx = audioCtx;
  var master = masterGain;
  if (!ctx || !master) return;
  var t0 = ctx.currentTime + (opts.at || 0);
  var dur = opts.dur;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = opts.type || 'sine';
  osc.frequency.setValueAtTime(opts.freq, t0);
  if (opts.glideTo) osc.frequency.exponentialRampToValueAtTime(opts.glideTo, t0 + dur);
  var peak = typeof opts.gain === 'number' ? opts.gain : 0.3;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peak, t0 + (opts.attack || 0.008));
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(master);
  if (opts.vibrato) {
    var lfo = ctx.createOscillator();
    var lfoGain = ctx.createGain();
    lfo.frequency.value = opts.vibrato.rate;
    lfoGain.gain.value = opts.vibrato.depth;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    lfo.start(t0);
    lfo.stop(t0 + dur + 0.05);
  }
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

var PLAYERS = {
  'soft-ping': function () { note({ freq: 880, dur: 0.4, gain: 0.3 }); },
  'blip': function () { note({ freq: 520, glideTo: 390, dur: 0.09, type: 'triangle', gain: 0.4 }); },
  'tick': function () { note({ freq: 1900, dur: 0.035, gain: 0.12 }); },
  'pulse': function () { note({ freq: 660, dur: 0.08, gain: 0.3 }); note({ freq: 660, at: 0.12, dur: 0.09, gain: 0.3 }); },
  'bubble-pop': function () { note({ freq: 420, glideTo: 1050, dur: 0.07, gain: 0.5 }); note({ freq: 1600, at: 0.06, dur: 0.03, gain: 0.18 }); },
  'double-pop': function () {
    note({ freq: 420, glideTo: 1050, dur: 0.07, gain: 0.5 });
    note({ freq: 1600, at: 0.06, dur: 0.03, gain: 0.18 });
    note({ freq: 420, at: 0.11, glideTo: 1050, dur: 0.07, gain: 0.5 });
    note({ freq: 1600, at: 0.17, dur: 0.03, gain: 0.18 });
  },
  'plop': function () { note({ freq: 430, glideTo: 160, dur: 0.12, gain: 0.5 }); },
  'bloop': function () { note({ freq: 290, glideTo: 540, dur: 0.16, type: 'triangle', gain: 0.45 }); },
  'wobble': function () { note({ freq: 440, dur: 0.3, gain: 0.32, vibrato: { rate: 14, depth: 38 } }); },
  'chime': function () { note({ freq: 659.25, dur: 0.5, gain: 0.3 }); note({ freq: 880, at: 0.12, dur: 0.6, gain: 0.32 }); },
  'bell': function () { note({ freq: 784, dur: 0.8, gain: 0.28 }); note({ freq: 1568, dur: 0.5, gain: 0.1 }); note({ freq: 2352, dur: 0.3, gain: 0.05 }); },
  'crystal': function () { note({ freq: 1568, dur: 0.35, gain: 0.24 }); note({ freq: 3136, dur: 0.2, gain: 0.06 }); },
  'music-box': function () { note({ freq: 1046.5, dur: 0.3, gain: 0.26 }); note({ freq: 1318.5, at: 0.13, dur: 0.3, gain: 0.26 }); note({ freq: 1568, at: 0.26, dur: 0.4, gain: 0.26 }); },
  'wind-chime': function () {
    note({ freq: 1318.5, dur: 0.4, gain: 0.16 });
    note({ freq: 1760, at: 0.09, dur: 0.4, gain: 0.16 });
    note({ freq: 2093, at: 0.18, dur: 0.4, gain: 0.16 });
    note({ freq: 2637, at: 0.27, dur: 0.45, gain: 0.16 });
  },
  'rise': function () { note({ freq: 300, glideTo: 1200, dur: 0.25, gain: 0.3 }); },
  'complete': function () { note({ freq: 523.25, dur: 0.35, gain: 0.3 }); note({ freq: 659.25, at: 0.09, dur: 0.35, gain: 0.3 }); note({ freq: 784, at: 0.18, dur: 0.45, gain: 0.3 }); },
  'climb': function () {
    note({ freq: 523.25, dur: 0.25, gain: 0.26 });
    note({ freq: 587.33, at: 0.07, dur: 0.25, gain: 0.26 });
    note({ freq: 659.25, at: 0.14, dur: 0.25, gain: 0.26 });
    note({ freq: 784, at: 0.21, dur: 0.3, gain: 0.26 });
  },
  'sparkle': function () { note({ freq: 1568, dur: 0.2, gain: 0.14 }); note({ freq: 2093, at: 0.06, dur: 0.2, gain: 0.14 }); note({ freq: 2637, at: 0.12, dur: 0.25, gain: 0.14 }); },
  'alert': function () { note({ freq: 880, dur: 0.12, type: 'square', gain: 0.1 }); note({ freq: 659.25, at: 0.16, dur: 0.18, type: 'square', gain: 0.1 }); },
  'knock': function () { note({ freq: 150, glideTo: 90, dur: 0.08, gain: 0.6 }); note({ freq: 150, at: 0.18, glideTo: 90, dur: 0.09, gain: 0.6 }); }
};

function playSound(id) {
  ensureAudio();
  var player = PLAYERS[id];
  if (player) player();
}

/* Build one button per sound. */
var grid = document.getElementById('grid');
Object.keys(PLAYERS).forEach(function (id) {
  var btn = document.createElement('button');
  btn.textContent = id;
  btn.addEventListener('click', function () { playSound(id); });
  grid.appendChild(btn);
});
</script>
</body>
</html>
